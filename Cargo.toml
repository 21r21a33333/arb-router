[package]
name = "arb-router"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "arb-router"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
config = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
eyre = "0.6"
time = { version = "0.3", features = ["serde", "macros"] }
alloy-primitives = { version = "1", default-features = false }
uniswap_v3_math = { version = "0.6", default-features = false }
# Curve AMM math (all 12 StableSwap/CryptoSwap variants), wei-exact vs on-chain get_dy.
curve-math = { git = "https://github.com/sunce86/curve-math", features = ["swap"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util", "macros"] }
